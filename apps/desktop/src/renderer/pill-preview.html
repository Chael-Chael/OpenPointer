<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenPointer Pill Style Playground</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f0f11;
    --surface: #1a1a1e;
    --surface-hover: #242428;
    --border: rgba(255,255,255,0.08);
    --text: #e8e8ed;
    --text-muted: #86868b;
    --accent: #3478f6;
  }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    min-height: 100vh;
  }

  /* ── Control Panel ── */
  .panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px;
    overflow-y: auto;
    max-height: 100vh;
  }

  .panel h1 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--text);
  }

  .panel .subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .section {
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .control {
    margin-bottom: 14px;
  }

  .control label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }

  .control .val {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-width: 60px;
    text-align: right;
  }

  .control input[type="range"] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
  }

  .control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px rgba(52,120,246,0.3);
    cursor: pointer;
  }

  .control input[type="color"] {
    width: 36px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface-hover);
    cursor: pointer;
    padding: 2px;
  }

  .color-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .color-row input[type="text"] {
    flex: 1;
    background: var(--surface-hover);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    color: var(--text);
    font-size: 12px;
    font-family: monospace;
    outline: none;
  }

  .color-row input[type="text"]:focus {
    border-color: var(--accent);
  }

  /* ── Preview Area ── */
  .preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
    position: relative;
  }

  .preview-label {
    position: absolute;
    top: 20px;
    left: 24px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  /* Background scene selector */
  .bg-options {
    position: absolute;
    top: 20px;
    right: 24px;
    display: flex;
    gap: 8px;
  }

  .bg-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .bg-btn.active { border-color: var(--accent); }

  .bg-scene {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 800px;
  }

  .bg-default {
    background: linear-gradient(135deg, #e8f0fe 0%, #d4e4fc 50%, #c7d9f7 100%);
  }

  .bg-dark {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  }

  .bg-mixed {
    background: linear-gradient(135deg, #2d2d35 0%, #1a1a22 50%, #111118 100%);
  }

  .bg-photo {
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400"><defs><linearGradient id="g1" x1="0%25" y1="0%25" x2="100%25" y2="100%25"><stop offset="0%25" style="stop-color:%23667eea"/><stop offset="100%25" style="stop-color:%23764ba2"/></linearGradient></defs><rect fill="url(%23g1)" width="800" height="400"/><circle cx="600" cy="100" r="80" fill="rgba(255,255,255,0.1)"/><circle cx="200" cy="300" r="120" fill="rgba(255,255,255,0.08)"/></svg>') center/cover;
  }

  /* ── The Pill itself ── */
  .pill-wrapper {
    position: relative;
    display: inline-flex;
    width: 100%;
    max-width: 600px;
  }

  .pill-glow {
    position: absolute;
    inset: 0;
    border-radius: 100px;
    background: rgba(13, 111, 255, 0.56);
    filter: blur(23.9px);
    pointer-events: none;
    z-index: 0;
  }

  .pill-container {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 0;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 24px;
    border-radius: 100px;
    position: relative;
    z-index: 1;
    overflow: hidden;
    min-width: 320px;
    max-width: 600px;
    width: 100%;
    cursor: default;
    transition: box-shadow 0.3s ease;
  }

  .pill-backdrop {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
  }

  .pill-inner-shadow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
  }

  .pill-icon {
    flex-shrink: 0;
    width: 29px;
    height: 29px;
  }

  .pill-icon svg {
    width: 100%;
    height: 100%;
  }

  .pill-text {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 24px;
    white-space: nowrap;
    color: white;
    line-height: 1;
    font-variation-settings: "opsz" 14;
  }

  .pill-menu-icon {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pill-menu-icon svg {
    width: 100%;
    height: 100%;
  }

  /* ── CSS Output ── */
  .output-section {
    margin-top: 24px;
    width: 100%;
    max-width: 800px;
  }

  .output-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    width: 100%;
    transition: background 0.15s;
  }

  .output-toggle:hover { background: var(--surface-hover); }

  .output-toggle .arrow {
    margin-left: auto;
    transition: transform 0.2s;
    color: var(--text-muted);
  }

  .output-toggle.open .arrow { transform: rotate(180deg); }

  .output-box {
    display: none;
    margin-top: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    position: relative;
  }

  .output-box.visible { display: block; }

  .output-box pre {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-all;
    overflow-x: auto;
  }

  .copy-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 6px 12px;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .copy-btn:hover { opacity: 0.85; }
  .copy-btn.copied { background: #30a14e; }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .panel { max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
    .preview { min-height: auto; padding: 60px 20px 40px; }
  }
</style>
</head>
<body>
<div class="layout">
  <!-- ── Control Panel ── -->
  <div class="panel" id="panel">
    <h1>Pill Style Playground</h1>
    <p class="subtitle">Adjust parameters, preview in real-time, copy CSS output</p>

    <!-- Shape -->
    <div class="section">
      <div class="section-title">Shape</div>
      <div class="control">
        <label>Border Radius <span class="val" id="v-radius">100px</span></label>
        <input type="range" id="radius" min="0" max="100" value="100" />
      </div>
      <div class="control">
        <label>Width <span class="val" id="v-width">240px</span></label>
        <input type="range" id="width" min="240" max="800" value="240" />
      </div>
      <div class="control">
        <label>Height <span class="val" id="v-height">36px</span></label>
        <input type="range" id="height" min="36" max="96" value="36" />
      </div>
    </div>

    <!-- Colors -->
    <div class="section">
      <div class="section-title">Background</div>
      <div class="control">
        <label>Color</label>
        <div class="color-row">
          <input type="color" id="bgColor" value="#0d6fff" />
          <input type="text" id="bgColorText" value="rgba(13,111,255,0.85)" />
        </div>
      </div>
      <div class="control">
        <label>Opacity <span class="val" id="v-opacity">0.85</span></label>
        <input type="range" id="opacity" min="0" max="100" value="85" />
      </div>
    </div>

    <!-- Effects -->
    <div class="section">
      <div class="section-title">Effects</div>
      <div class="control">
        <label>Backdrop Blur <span class="val" id="v-blur">6.8px</span></label>
        <input type="range" id="blur" min="0" max="40" value="6.8" step="0.1" />
      </div>
      <div class="control">
        <label>Shadow Spread X <span class="val" id="v-shX">0px</span></label>
        <input type="range" id="shX" min="-20" max="40" value="0" />
      </div>
      <div class="control">
        <label>Shadow Spread Y <span class="val" id="v-shY">8px</span></label>
        <input type="range" id="shY" min="-20" max="40" value="8" />
      </div>
      <div class="control">
        <label>Shadow Blur <span class="val" id="v-shB">6px</span></label>
        <input type="range" id="shB" min="0" max="40" value="6" />
      </div>
      <div class="control">
        <label>Shadow Color</label>
        <div class="color-row">
          <input type="color" id="shColor" value="#000000" />
          <input type="text" id="shColorText" value="rgba(0,0,0,0.05)" />
        </div>
      </div>
    </div>

    <!-- Inner Glow -->
    <div class="section">
      <div class="section-title">Inner Glass Overlay</div>
      <div class="control">
        <label>
          <span>Enable Inset Glow</span>
          <input type="checkbox" id="innerGlow" checked />
        </label>
      </div>
      <div class="control">
        <label>Top Inset <span class="val" id="v-inTop">1px</span></label>
        <input type="range" id="inTop" min="0" max="4" value="1" step="0.5" />
      </div>
      <div class="control">
        <label>Bottom Inset <span class="val" id="v-inBot">-1px</span></label>
        <input type="range" id="inBot" min="-4" max="2" value="-1" step="0.5" />
      </div>
      <div class="control">
        <label>Blur <span class="val" id="v-inBlur">3px</span></label>
        <input type="range" id="inBlur" min="0" max="8" value="3" step="0.5" />
      </div>
      <div class="control">
        <label>Highlight Opacity <span class="val" id="v-inAlpha">0.6</span></label>
        <input type="range" id="inAlpha" min="0" max="100" value="60" />
      </div>
    </div>

    <!-- Blur Glow -->
    <div class="section">
      <div class="section-title">Blur Glow (underneath)</div>
      <div class="control">
        <label>
          <span>Enable Blur Glow</span>
          <input type="checkbox" id="glowEnabled" checked />
        </label>
      </div>
      <div class="control">
        <label>Color</label>
        <div class="color-row">
          <input type="color" id="glowColor" value="#0d6fff" />
          <input type="text" id="glowColorText" value="rgba(13,111,255,0.56)" />
        </div>
      </div>
      <div class="control">
        <label>Opacity <span class="val" id="v-glowOpacity">0.56</span></label>
        <input type="range" id="glowOpacity" min="0" max="100" value="56" />
      </div>
      <div class="control">
        <label>Blur Radius <span class="val" id="v-glowBlur">23.9px</span></label>
        <input type="range" id="glowBlur" min="0" max="60" value="23.9" step="0.1" />
      </div>
    </div>

    <!-- Spacing -->
    <div class="section">
      <div class="section-title">Spacing</div>
      <div class="control">
        <label>Padding X <span class="val" id="v-px">24px</span></label>
        <input type="range" id="padX" min="8" max="48" value="24" />
      </div>
      <div class="control">
        <label>Padding Y <span class="val" id="v-py">12px</span></label>
        <input type="range" id="padY" min="4" max="32" value="12" />
      </div>
      <div class="control">
        <label>Icon-Text Gap <span class="val" id="v-gap">24px</span></label>
        <input type="range" id="gap" min="4" max="48" value="24" />
      </div>
    </div>

    <!-- Typography -->
    <div class="section">
      <div class="section-title">Typography</div>
      <div class="control">
        <label>Font Size <span class="val" id="v-fontSize">14px</span></label>
        <input type="range" id="fontSize" min="10" max="40" value="14" />
      </div>
      <div class="control">
        <label>Font Weight</label>
        <select id="fontWeight" style="width:100%;background:var(--surface-hover);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:13px;outline:none;">
          <option value="400">400 - Regular</option>
          <option value="500" selected>500 - Medium</option>
          <option value="600">600 - Semi Bold</option>
          <option value="700">700 - Bold</option>
        </select>
      </div>
      <div class="control">
        <label>Text Color</label>
        <div class="color-row">
          <input type="color" id="textColor" value="#ffffff" />
          <input type="text" id="textColorText" value="#ffffff" />
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="section">
      <div class="section-title">Content</div>
      <div class="control">
        <label>Placeholder Text</label>
        <input type="text" id="placeholderText" value="Ask Something..." style="width:100%;background:var(--surface-hover);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:13px;outline:none;" />
      </div>
      <div class="control">
        <label>Text Opacity <span class="val" id="v-textOpacity">0.55</span></label>
        <input type="range" id="textOpacity" min="0" max="100" value="55" />
      </div>
      <div class="control">
        <label>Left Icon Size <span class="val" id="v-iconSize">29px</span></label>
        <input type="range" id="iconSize" min="14" max="48" value="29" />
      </div>
      <div class="control">
        <label>Menu Icon Size <span class="val" id="v-menuIconSize">24px</span></label>
        <input type="range" id="menuIconSize" min="12" max="40" value="24" />
      </div>
      <div class="control">
        <label>Icon Opacity <span class="val" id="v-iconOpacity">1</span></label>
        <input type="range" id="iconOpacity" min="0" max="100" value="100" />
      </div>
    </div>
  </div>

  <!-- ── Preview ── -->
  <div class="preview" id="preview">
    <span class="preview-label">Live Preview</span>

    <div class="bg-options">
      <button class="bg-btn bg-default active" data-bg="default" title="Light blue gradient"></button>
      <button class="bg-btn bg-dark" data-bg="dark" title="Dark blue gradient"></button>
      <button class="bg-btn bg-mixed" data-bg="mixed" title="Dark mixed"></button>
      <button class="bg-btn bg-photo" data-bg="photo" title="Gradient image"></button>
    </div>

    <div class="bg-scene bg-default" id="scene">
      <div class="pill-container">
        <div class="pill-wrapper">
          <div class="pill-glow" id="pillGlow"></div>
          <div class="pill" id="pill">
            <div class="pill-backdrop" id="pillBackdrop"></div>
            <div class="pill-inner-shadow" id="pillInner"></div>
          <!-- Icon: waveform / sound wave -->
          <div class="pill-icon" id="pillIcon">
            <svg viewBox="0 0 29 29" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14.5 3C14.5 3 12.5 7 12.5 14.5C12.5 22 14.5 26 14.5 26" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <path d="M9 6.5C9 6.5 7.5 10 7.5 14.5C7.5 19 9 22.5 9 22.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <path d="M3.5 10C3.5 10 2.5 12.5 2.5 14.5C2.5 16.5 3.5 19 3.5 19" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <path d="M20 6.5C20 6.5 21.5 10 21.5 14.5C21.5 19 20 22.5 20 22.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <path d="M25.5 10C25.5 10 26.5 12.5 26.5 14.5C26.5 16.5 25.5 19 25.5 19" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <!-- Text -->
          <div class="pill-text" id="pillText">Ask Something...</div>
          <!-- Menu icon: hamburger -->
          <div class="pill-menu-icon" id="pillMenuIcon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="3" y1="6" x2="21" y2="6" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <line x1="3" y1="12" x2="21" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <line x1="3" y1="18" x2="21" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          </div><!-- /pill -->
        </div><!-- /pill-wrapper -->
      </div><!-- /pill-container -->

      <!-- CSS Output -->
      <div class="output-section">
        <button class="output-toggle" id="outputToggle" onclick="toggleOutput()">
          <span>Generated CSS / Tailwind</span>
          <span class="arrow">&#9660;</span>
        </button>
        <div class="output-box" id="outputBox">
          <button class="copy-btn" id="copyBtn" onclick="copyOutput()">Copy</button>
          <pre id="outputPre"></pre>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── State ──
const state = {
  radius: 100, width: 240, height: 36,
  bgColor: '#0d6fff', opacity: 0.85,
  blur: 6.8, shX: 0, shY: 8, shB: 6, shColor: '#000000', shAlpha: 0.05,
  innerGlow: true, inTop: 1, inBot: -1, inBlur: 3, inAlpha: 0.6,
  glowEnabled: true, glowColor: '#0d6fff', glowOpacity: 0.56, glowBlur: 23.9,
  padX: 24, padY: 12, gap: 24,
  fontSize: 14, fontWeight: 500, textColor: '#ffffff',
  placeholderText: 'Ask Something...', textOpacity: 0.55,
  iconSize: 29, menuIconSize: 24, iconOpacity: 1
};

// ── Elements ──
const $ = id => document.getElementById(id);
const pill = $('pill'), pillBackdrop = $('pillBackdrop'), pillInner = $('pillInner'), pillGlow = $('pillGlow');
const pillText = $('pillText'), pillIcon = $('pillIcon'), pillMenuIcon = $('pillMenuIcon');

// ── Helpers ──
function rgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function hexToRgbStr(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `${r},${g},${b}`;
}

// ── Render ──
function render() {
  const s = state;

  // Pill container
  pill.style.width = s.width + 'px';
  pill.style.height = s.height + 'px';
  pill.style.borderRadius = s.radius + 'px';
  pill.style.padding = `${s.padY}px ${s.padX}px`;
  pill.style.gap = s.gap + 'px';

  // Blur glow layer (underneath pill, same shape)
  if (s.glowEnabled) {
    pillGlow.style.background = rgba(s.glowColor, s.glowOpacity);
    pillGlow.style.filter = `blur(${s.glowBlur}px)`;
    pillGlow.style.borderRadius = s.radius + 'px';
    pillGlow.style.display = '';
  } else {
    pillGlow.style.display = 'none';
  }

  // Backdrop (main background color)
  pillBackdrop.style.background = rgba(s.bgColor, s.opacity);
  pillBackdrop.style.backdropFilter = `blur(${s.blur}px)`;
  pillBackdrop.style.webkitBackdropFilter = `blur(${s.blur}px)`;

  // Box shadow (no border, using shadow instead)
  pill.style.boxShadow = `${s.shX}px ${s.shY}px ${s.shB}px ${rgba(s.shColor, s.shAlpha)}`;
  pill.style.border = 'none';

  // Inner glow
  if (s.innerGlow) {
    pillInner.style.boxShadow = [
      `inset 2px 3px ${s.inBlur}px -3px rgba(255,255,255,${s.inAlpha})`,
      `inset 0px ${s.inBot}px ${s.inBlur}px 0px rgba(255,255,255,${s.inAlpha * 0.42})`,
      `inset 0px ${s.inTop}px ${s.inBlur}px 0px rgba(255,255,255,${s.inAlpha * 0.42})`
    ].join(',');
    pillInner.style.background = 'transparent';
  } else {
    pillInner.style.boxShadow = 'none';
    pillInner.style.background = 'transparent';
  }

  // Typography
  pillText.style.fontSize = s.fontSize + 'px';
  pillText.style.fontWeight = s.fontWeight;
  pillText.style.color = s.textColor;
  pillText.style.opacity = s.textOpacity;
  pillText.textContent = s.placeholderText;

  // Icon sizing & opacity
  pillIcon.style.width = s.iconSize + 'px';
  pillIcon.style.height = s.iconSize + 'px';
  pillIcon.style.opacity = s.iconOpacity;
  pillMenuIcon.style.width = s.menuIconSize + 'px';
  pillMenuIcon.style.height = s.menuIconSize + 'px';
  pillMenuIcon.style.opacity = s.iconOpacity;

  // Icon colors
  const iconSvgPaths = pillIcon.querySelectorAll('path, line');
  iconSvgPaths.forEach(p => {
    if (p.tagName === 'path') p.setAttribute('stroke', s.textColor);
    else p.setAttribute('stroke', s.textColor);
  });
  const menuSvgPaths = pillMenuIcon.querySelectorAll('line');
  menuSvgPaths.forEach(p => p.setAttribute('stroke', s.textColor));

  updateOutput();
}

// ── Bind Controls ──
function bind(id, key, valFn, suffix = 'px') {
  const el = $(id);
  if (!el) return;
  el.addEventListener('input', () => {
    state[key] = valFn(el);
    const vEl = $('v-' + id);
    if (vEl) vEl.textContent = (typeof state[key] === 'number' && !Number.isInteger(state[key]))
      ? state[key].toFixed(1) + suffix
      : state[key] + suffix;
    render();
  });
}

// Range controls
bind('radius', 'radius', e => +e.value);
bind('width', 'width', e => +e.value);
bind('height', 'height', e => +e.value);
bind('opacity', 'opacity', e => +e.value / 100, '');
bind('blur', 'blur', e => +e.value);
bind('shX', 'shX', e => +e.value);
bind('shY', 'shY', e => +e.value);
bind('shB', 'shB', e => +e.value);
bind('inTop', 'inTop', e => +e.value);
bind('inBot', 'inBot', e => +e.value);
bind('inBlur', 'inBlur', e => +e.value);
bind('inAlpha', 'inAlpha', e => +e.value / 100, '');
bind('glowOpacity', 'glowOpacity', e => +e.value / 100, '');
bind('glowBlur', 'glowBlur', e => +e.value);
bind('padX', 'padX', e => +e.value);
bind('padY', 'padY', e => +e.value);
bind('gap', 'gap', e => +e.value);
bind('fontSize', 'fontSize', e => +e.value);
bind('textOpacity', 'textOpacity', e => +e.value / 100, '');
bind('iconSize', 'iconSize', e => +e.value);
bind('menuIconSize', 'menuIconSize', e => +e.value);
bind('iconOpacity', 'iconOpacity', e => +e.value / 100, '');

// Text input controls
$('placeholderText').addEventListener('input', e => {
  state.placeholderText = e.target.value;
  render();
});

// Color controls
function bindColor(colorId, textId, stateKey, alphaKey) {
  const cEl = $(colorId);
  const tEl = $(textId);
  cEl.addEventListener('input', () => {
    state[stateKey] = cEl.value;
    if (alphaKey !== undefined) {
      tEl.value = rgba(cEl.value, state[alphaKey]);
    } else {
      tEl.value = cEl.value;
    }
    render();
  });
  tEl.addEventListener('change', () => {
    // Try to parse rgba
    const m = tEl.value.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
    if (m) {
      state[stateKey] = '#' + [m[1],m[2],m[3]].map(x => (+x).toString(16).padStart(2,'0')).join('');
      cEl.value = state[stateKey];
      if (alphaKey !== undefined && m[4] !== undefined) {
        state[alphaKey] = +m[4];
      }
      tEl.value = alphaKey !== undefined ? rgba(state[stateKey], state[alphaKey]) : state[stateKey];
    }
    render();
  });
}

bindColor('bgColor', 'bgColorText', 'bgColor', 'opacity');
bindColor('shColor', 'shColorText', 'shColor', 'shAlpha');
bindColor('textColor', 'textColorText', 'textColor');
bindColor('glowColor', 'glowColorText', 'glowColor', 'glowOpacity');

// Shadow alpha (attached to shAlpha through shColor text)
$('shColor').addEventListener('input', () => {
  // Sync shAlpha display
  const m = $('shColorText').value.match(/rgba\(\d+,\s*\d+,\s*\d+,([\d.]+)\)/);
  if (m) state.shAlpha = +m[1];
});

// Shadow alpha via text input
$('shColorText').addEventListener('change', () => {
  const m = $('shColorText').value.match(/rgba\(\d+,\s*\d+,\s*\d+,([\d.]+)\)/);
  if (m) state.shAlpha = +m[1];
});

// Glow color alpha sync
$('glowColor').addEventListener('input', () => {
  const m = $('glowColorText').value.match(/rgba\(\d+,\s*\d+,\s*\d+,([\d.]+)\)/);
  if (m) state.glowOpacity = +m[1];
});

$('glowColorText').addEventListener('change', () => {
  const m = $('glowColorText').value.match(/rgba\(\d+,\s*\d+,\s*\d+,([\d.]+)\)/);
  if (m) state.glowOpacity = +m[1];
});

// Glow enabled toggle
$('glowEnabled').addEventListener('change', e => {
  state.glowEnabled = e.target.checked;
  render();
});

// Font weight
$('fontWeight').addEventListener('change', e => {
  state.fontWeight = +e.target.value;
  render();
});

// Inner glow toggle
$('innerGlow').addEventListener('change', e => {
  state.innerGlow = e.target.checked;
  render();
});

// Background scene buttons
document.querySelectorAll('.bg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.bg-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const scene = $('scene');
    scene.className = 'bg-scene bg-' + btn.dataset.bg;
  });
});

// ── Output ──
function toggleOutput() {
  const box = $('outputBox');
  const toggle = $('outputToggle');
  box.classList.toggle('visible');
  toggle.classList.toggle('open');
}

function updateOutput() {
  const s = state;
  const bgRgba = rgba(s.bgColor, s.opacity);
  const shRgba = rgba(s.shColor, s.shAlpha);
  const inAlphaHi = s.inAlpha;
  const inAlphaLo = s.inAlpha * 0.42;

  const css = `/* ── Pill Container ── */
.pill {
  display: flex;
  align-items: center;
  gap: ${s.gap}px;
  padding: ${s.padY}px ${s.padX}px;
  width: ${s.width}px;
  height: ${s.height}px;
  border-radius: ${s.radius}px;
  position: relative;
  overflow: hidden;
  border: none;
  box-shadow: ${s.shX}px ${s.shY}px ${s.shB}px ${shRgba};
  cursor: default;
}

/* ── Background Layer ── */
.pill-backdrop {
  position: absolute;
  inset: 0;
  background: ${bgRgba};
  backdrop-filter: blur(${s.blur}px);
  -webkit-backdrop-filter: blur(${s.blur}px);
  border-radius: inherit;
  pointer-events: none;
}`;

  if (s.glowEnabled) {
    const glowRgba = rgba(s.glowColor, s.glowOpacity);
    css += `\n\n/* ── Blur Glow (underneath) ── */
.pill-glow {
  position: absolute;
  inset: 0;
  border-radius: ${s.radius}px;
  background: ${glowRgba};
  filter: blur(${s.glowBlur}px);
  pointer-events: none;
  z-index: 0;
}`;
  }

  if (s.innerGlow) {
    const innerShadow = [
      `inset 2px 3px ${s.inBlur}px -3px rgba(255,255,255,${inAlphaHi.toFixed(2)})`,
      `inset 0px ${s.inBot}px ${s.inBlur}px 0px rgba(255,255,255,${inAlphaLo.toFixed(2)})`,
      `inset 0px ${s.inTop}px ${s.inBlur}px 0px rgba(255,255,255,${inAlphaLo.toFixed(2)})`
    ].join(',\n    ');

    const cssInner = `\n\n/* ── Inner Glass Overlay ── */
.pill-inner-shadow {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow: ${innerShadow};
}`;
    $('outputPre').textContent = css + cssInner + contentCss();
  } else {
    $('outputPre').textContent = css + contentCss();
  }
}

function contentCss() {
  const s = state;
  return `\n\n/* ── Content ── */
.pill-text {
  flex: 1;
  font-family: 'DM Sans', sans-serif;
  font-weight: ${s.fontWeight};
  font-size: ${s.fontSize}px;
  color: ${s.textColor};
  opacity: ${s.textOpacity};
  white-space: nowrap;
  line-height: 1;
}

.pill-icon {
  flex-shrink: 0;
  width: ${s.iconSize}px;
  height: ${s.iconSize}px;
  opacity: ${s.iconOpacity};
}

.pill-menu-icon {
  flex-shrink: 0;
  width: ${s.menuIconSize}px;
  height: ${s.menuIconSize}px;
  opacity: ${s.iconOpacity};
}`;
}

function copyOutput() {
  const text = $('outputPre').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = $('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
  });
}

// ── Init ──
render();
</script>
</body>
</html>
